version: 2

# Key columns of every intermediate model are never null, and the enum-shaped columns hold
# only the values the registry declares (stats/registry/dimensions.yaml). Cheap column scans,
# run on every `dbt build` pass. Uniqueness of (user_id, hand_uid) is guaranteed by
# construction (one row per hand that saw a flop, rebuilt per partition); a `unique` test here
# would be a 3M-row aggregation inside every incremental pass.

models:
  - name: int_board_by_street
    description: Per hand that saw a flop — board facets as they stood at each street.
    columns:
      - name: user_id
        tests: [not_null]
      - name: hand_uid
        tests: [not_null]
      - name: played_at_utc
        tests: [not_null]
      - name: src_parsed_at
        tests: [not_null]
      - name: flop_suitedness
        tests:
          - accepted_values:
              values: ['monotone', 'two_tone', 'rainbow']
      - name: flop_pairing
        tests:
          - accepted_values:
              values: ['trips', 'paired', 'unpaired']
      - name: flop_connectivity
        tests:
          - accepted_values:
              values: ['connected', 'oesd', 'disconnected']
      - name: flop_high_card_class
        tests:
          - accepted_values:
              values: ['ace', 'king_queen', 'jack_ten', 'middle', 'low']
      # '' is the value before the street was dealt; every hand here saw a flop, not every one
      # a turn or a river.
      - name: turn_change
        tests:
          - accepted_values:
              values: ['', 'turn_flush', 'turn_straight', 'turn_pair', 'turn_flush_draw', 'turn_overcard', 'turn_blank']
      - name: river_change
        tests:
          - accepted_values:
              values: ['', 'river_flush', 'river_straight', 'river_pair', 'river_overcard', 'river_blank']
