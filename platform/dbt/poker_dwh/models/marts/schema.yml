version: 2

# The v2 facts (plan C.2). Keys never null; the enum-shaped columns hold only the values the
# registry declares (stats/registry/dimensions.yaml), so a derivation bug shows up as a failed
# test rather than as a situation no filter can name. Cheap: not_null is a column scan and
# accepted_values a GROUP BY on a LowCardinality column, both partition-pruned by nothing but
# still linear -- the same trade the intermediate tests make.

models:
  - name: decisions
    description: One row per decision point, with the state before it (ADR-020).
    columns:
      - name: user_id
        tests: [not_null]
      - name: hand_uid
        tests: [not_null]
      - name: seat
        tests: [not_null]
      - name: action_index
        tests: [not_null]
      - name: played_at_utc
        tests: [not_null]
      - name: src_parsed_at
        tests: [not_null]
      - name: facing
        tests:
          - accepted_values:
              values: [none, limp, bet, raise, 3bet, 4bet, 5bet_plus]
      - name: prev_street_faced
        tests:
          - accepted_values:
              values: [none, limp, bet, raise, 3bet, 4bet, 5bet_plus]
      - name: pot_type
        tests:
          - accepted_values:
              values: [limped, srp, 3bet, 4bet, 5bet_plus]

  - name: player_hands
    description: One row per (hand, player); the hand-grain fact (ADR-020).
    columns:
      - name: user_id
        tests: [not_null]
      - name: hand_uid
        tests: [not_null]
      - name: seat
        tests: [not_null]
      - name: played_at_utc
        tests: [not_null]
      - name: src_parsed_at
        tests: [not_null]
      - name: hand_shape
        tests:
          - accepted_values:
              values: ['', pair, suited, offsuit]
