# CI for the poker platform.
#
# Unit tests run with no services — the parser, the canonical model, the validator and the
# query compiler are all pure functions, which is deliberate: the parts most likely to hold a
# correctness bug are the parts that need no infrastructure to test.
#
# The integration job brings up the real stack, because the seams between components are
# where the remaining bugs live.

name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: platform

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy core parser ingestion stats analysis api
      - name: Module boundaries (import-linter, ADR-023)
        run: uv run lint-imports
      - name: Generated files are current (core/schema -> dbt staging)
        run: uv run python -m scripts.gen_schema --check && uv run python -m scripts.gen_stats --check
      - name: Size limits (40-line functions, 300-line files; baseline burns down only)
        run: uv run python -m scripts.check_sizes
      - name: Unit tests
        run: uv run pytest -q -m "not integration"

  web:
    # The JavaScript workspace (ADR-027): typecheck, lint, Vitest, and the licence audit that
    # fails on any copyleft dependency, direct or transitive.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci
      - name: Typecheck, lint, unit tests, licence audit
        run: npm run check

  integration:
    runs-on: ubuntu-latest
    # The suite provisions and drops its own databases; these names are what it insists on
    # (see platform/Makefile TEST_ENV and tests/integration/conftest.py).
    env:
      CLICKHOUSE_DB_PREFIX: test_
      POSTGRES_DB: poker_test
      S3_RAW_BUCKET: poker-raw-test
      KAFKA_UPLOADS_TOPIC: test.hands.uploads.v1
      KAFKA_BULK_TOPIC: test.hands.bulkimport.v1
      KAFKA_CONSUMER_GROUP: test-parser-workers
      REDIS_URL: redis://localhost:6380/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Install dbt
        run: |
          uv venv .venv-dbt --python 3.12
          VIRTUAL_ENV=.venv-dbt uv pip install "dbt-core~=1.9" "dbt-clickhouse~=1.8"
      - name: Provision the test databases (Postgres, ClickHouse, bucket, empty dbt tables)
        run: uv run python -m api.provision
      - name: Seed and build
        run: |
          uv run python -m scripts.seed
          .venv-dbt/bin/dbt build --project-dir dbt/poker_dwh --profiles-dir dbt/poker_dwh
      - name: Integration tests
        # Includes the tenant-isolation suite, which actively tries to break isolation.
        # If that ever passes-by-failing-to-run, the build must go red.
        run: uv run pytest -q -m integration
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
