# ---- aggression: bets + raises against calls (AF) and against all actions (AFq) ---------
- code: af_flop
  label: Aggression factor (flop)
  category: postflop
  grain: decision
  format: ratio
  numerator:
    countIf: {all: [{dim: street, op: eq, value: flop}, {dim: action, op: in, value: [bet, raise]}]}
  denominator:
    countIf: {all: [{dim: street, op: eq, value: flop}, {dim: action, op: eq, value: call}]}
  typical: [1.5, 4]
  description: Bets and raises divided by calls on the flop.

- code: af_turn
  label: Aggression factor (turn)
  category: postflop
  grain: decision
  format: ratio
  numerator:
    countIf: {all: [{dim: street, op: eq, value: turn}, {dim: action, op: in, value: [bet, raise]}]}
  denominator:
    countIf: {all: [{dim: street, op: eq, value: turn}, {dim: action, op: eq, value: call}]}
  typical: [1.5, 4]
  description: Bets and raises divided by calls on the turn.

- code: af_river
  label: Aggression factor (river)
  category: postflop
  grain: decision
  format: ratio
  numerator:
    countIf: {all: [{dim: street, op: eq, value: river}, {dim: action, op: in, value: [bet, raise]}]}
  denominator:
    countIf: {all: [{dim: street, op: eq, value: river}, {dim: action, op: eq, value: call}]}
  typical: [1, 3]
  description: Bets and raises divided by calls on the river.

- code: af_total
  label: Aggression factor
  category: postflop
  grain: decision
  format: ratio
  numerator:
    countIf: {all: [{dim: street, op: in, value: [flop, turn, river]}, {dim: action, op: in, value: [bet, raise]}]}
  denominator:
    countIf: {all: [{dim: street, op: in, value: [flop, turn, river]}, {dim: action, op: eq, value: call}]}
