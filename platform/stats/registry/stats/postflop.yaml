  action: {dim: action, op: eq, value: fold}
  typical: [40, 65]
  cached: true
  description: Bet the turn and folded when raised.
  notes: >-
    Exactly one raise stands in front of this seat's bet; a raise that has itself been re-raised
    is a different decision and does not count.
  v1_parity: v1 counted any second aggressive action on the street (-0.2% opportunities).

- code: fold_to_river_raise
