# Money and volume: hand grain, sums over `marts.player_hands`.
#
# `per100` is 100 * numerator / denominator; `count` is the numerator alone.
#
# `ev_bb_per_100` is labelled "All-in adjusted bb/100" and not "EV bb/100" on purpose: "EV" in
# this product already means a solver's expected value for a line, which is a different number
# from an all-in adjusted result. One name per number (ADR-057 §5, ADR-062).
#
# Its population baseline is the field's own all-in adjusted rate, and that number equals the
# field's actual bb/100 wherever the comparison covers whole hands -- by construction, not by
# coincidence (ADR-039's redistribution is between the seats of one hand; the pool holds every
# seat of it). The caveat below says so, because it is a reader's fact and not a client's
# special case (ADR-066).

- code: hands
  label: Hands
  category: money
  grain: hand
  format: count
  numerator: {count: true}
  cached: true
  description: Hands dealt in.

- code: bb_per_100
  label: bb/100
  category: money
  grain: hand
  format: per100
  numerator: {sum: net_won_bb}
  denominator: {count: true}
  higher_is_better: true
  typical: [0, 10]
  cached: true
  description: Big blinds won per 100 hands.

- code: ev_bb_per_100
  label: All-in adjusted bb/100
  category: money
  grain: hand
  format: per100
  numerator: {sum: ev_won_bb}
  denominator: {count: true}
  higher_is_better: true
  typical: [0, 10]
  cached: true
  description: Big blinds won per 100 hands, all-in adjusted; each all-in pot is shared out by expected share rather than awarded to whoever won it.
  notes: >-
    Where the site settled an all-in without dealing the rest of the board, nothing is
    adjusted: nobody gambled, so the actual result stands. Read the number against your own
    bb/100 to see how you ran; against the field it says what bb/100 says. The adjustment
    only moves chips between the seats of one hand and the pool holds every seat of it, so on
    any comparison covering whole hands the field's two rates are one number; they part company
    only where a comparison picks one seat out of a hand, and grouped by position they differ
    by up to 0.26 bb/100.

- code: sd_bb_per_100
  label: Showdown bb/100
  category: money
  grain: hand
  format: per100
  numerator: {sum: showdown_won_bb}
  denominator: {count: true}
  higher_is_better: true
  typical: [0, 30]
  cached: true
  description: Big blinds won at showdown per 100 hands.

- code: nsd_bb_per_100
  label: Non-showdown bb/100
  category: money
  grain: hand
  format: per100
  numerator: {sum: nonshowdown_won_bb}
  denominator: {count: true}
  higher_is_better: true
  typical: [-30, 0]
  cached: true
  description: Big blinds won without showdown per 100 hands.
