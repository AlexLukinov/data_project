# Creates the lab buckets and uploads a 3-row smoke CSV. Idempotent (mc mb --ignore-existing
# + mc cp overwrite). Safe to re-apply; the Job is recreated by `kubectl apply` only if changed,
# so the Makefile deletes+applies via `make minio` -> wait for complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: data-platform
  labels:
    app.kubernetes.io/part-of: data-platform-lab
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: data-platform-lab
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
          imagePullPolicy: IfNotPresent
          env:
            - name: ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio-root, key: rootUser }
            - name: ROOT_PASS
              valueFrom:
                secretKeyRef: { name: minio-root, key: rootPassword }
            - name: MC_HOST_local
              value: "http://$(ROOT_USER):$(ROOT_PASS)@minio:9000"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "waiting for minio..."
              for i in $(seq 1 30); do mc ready local && break || sleep 3; done
              for b in raw staging dwh spark; do
                mc mb --ignore-existing "local/$b"
              done
              printf 'id,name\n1,alpha\n2,beta\n3,gamma\n' > /tmp/smoke.csv
              mc cp /tmp/smoke.csv local/raw/_smoke/smoke.csv
              echo "== buckets =="; mc ls local
              echo "== smoke object =="; mc ls --recursive local/raw/_smoke/
              echo "bucket-init done"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
