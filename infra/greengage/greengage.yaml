# Single-host Greengage demo cluster (coordinator + 2 primary segments, no mirrors) in one pod.
# amd64 image, runs emulated on this arm64 stand. Cluster data persists on a PVC so it survives
# restarts. Reached via `kubectl exec` (psql) — no external listener config needed for the lab.
apiVersion: v1
kind: Service
metadata:
  name: greengage
  namespace: data-platform
  labels:
    app.kubernetes.io/part-of: data-platform-lab
    app.kubernetes.io/name: greengage
spec:
  selector:
    app.kubernetes.io/name: greengage
  ports:
    - { name: coordinator, port: 7000, targetPort: 7000 }
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: greengage
  namespace: data-platform
  labels:
    app.kubernetes.io/part-of: data-platform-lab
    app.kubernetes.io/name: greengage
spec:
  serviceName: greengage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: greengage
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: data-platform-lab
        app.kubernetes.io/name: greengage
    spec:
      securityContext:
        fsGroup: 1000                 # gpadmin, so the PVC is writable
      containers:
        - name: greengage
          image: greengage-demo:dev
          imagePullPolicy: Never       # built into minikube via `minikube image build`
          env:
            - { name: COORDINATOR_DATADIR, value: "/data" }
            - { name: NUM_PRIMARY_MIRROR_PAIRS, value: "2" }
            - { name: DEMO_PORT_BASE, value: "7000" }
          readinessProbe:
            tcpSocket: { port: 7000 }
            initialDelaySeconds: 90     # first init is slow under emulation
            periodSeconds: 15
            failureThreshold: 60
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2560Mi
          volumeMounts:
            - { name: gpdata, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: gpdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
