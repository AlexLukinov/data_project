# Seed data for the shop source DB. Runs once as owner 'shop' in db 'shop' at init.
# customers (1k), orders (10k, last 90 days, status), order_items (~30k). generate_series only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-seed-sql
  namespace: data-platform
  labels:
    app.kubernetes.io/part-of: data-platform-lab
data:
  seed.sql: |
    CREATE TABLE IF NOT EXISTS customers (
      id          bigint PRIMARY KEY,
      name        text NOT NULL,
      email       text NOT NULL,
      city        text NOT NULL,
      created_at  timestamptz NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS orders (
      id           bigint PRIMARY KEY,
      customer_id  bigint NOT NULL REFERENCES customers(id),
      status       text NOT NULL,
      order_ts     timestamptz NOT NULL,
      amount       numeric(10,2) NOT NULL,
      created_at   timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_orders_customer_id ON orders(customer_id);
    CREATE INDEX IF NOT EXISTS idx_orders_order_ts    ON orders(order_ts);

    CREATE TABLE IF NOT EXISTS order_items (
      id          bigint PRIMARY KEY,
      order_id    bigint NOT NULL REFERENCES orders(id),
      product     text NOT NULL,
      quantity    int NOT NULL,
      unit_price  numeric(10,2) NOT NULL
    );
    CREATE INDEX IF NOT EXISTS idx_order_items_order_id ON order_items(order_id);

    -- customers: 1000
    INSERT INTO customers (id, name, email, city)
    SELECT g,
           'customer_' || g,
           'customer_' || g || '@example.com',
           (ARRAY['Moscow','Saint Petersburg','Novosibirsk','Yekaterinburg','Kazan'])[1 + (g % 5)]
    FROM generate_series(1, 1000) g
    ON CONFLICT (id) DO NOTHING;

    -- orders: 10000, order_ts within the last 90 days, rotating status
    INSERT INTO orders (id, customer_id, status, order_ts, amount)
    SELECT g,
           1 + (g % 1000),
           (ARRAY['pending','paid','shipped','delivered','cancelled'])[1 + (g % 5)],
           now() - (interval '90 days') * random(),
           round((random() * 490 + 10)::numeric, 2)
    FROM generate_series(1, 10000) g
    ON CONFLICT (id) DO NOTHING;

    -- order_items: 3 per order => ~30000
    INSERT INTO order_items (id, order_id, product, quantity, unit_price)
    SELECT row_number() OVER (ORDER BY o.id, s),
           o.id,
           'product_' || (1 + ((o.id + s) % 50)),
           1 + ((o.id + s) % 5),
           round((random() * 100 + 5)::numeric, 2)
    FROM generate_series(1, 10000) o(id)
    CROSS JOIN generate_series(1, 3) s
    ON CONFLICT (id) DO NOTHING;
