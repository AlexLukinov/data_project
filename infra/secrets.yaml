# ─────────────────────────────────────────────────────────────────────────────
# LAB-ONLY credentials. admin/admin-style on purpose. NOT for anything real.
# This file is intentionally committed (per project spec) so the lab is one-command
# reproducible. Centralizes every credential the platform uses.
#
#   MinIO         minioadmin / minioadmin
#   Postgres shop shop / shop
#   ClickHouse    admin / admin       (defined in infra/clickhouse/chi.yaml)
#   Airflow UI    admin / admin       (defined in infra/airflow/values.yaml)
#   Kafka UI      (no auth)
#   Trino         any username, no password
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: data-platform
  labels:
    app.kubernetes.io/part-of: data-platform-lab
type: Opaque
stringData:
  # Keys consumed by the minio/minio chart via existingSecret
  rootUser: minioadmin
  rootPassword: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-db-app
  namespace: data-platform
  labels:
    app.kubernetes.io/part-of: data-platform-lab
# basic-auth so CloudNativePG can wire it as the application DB owner
type: kubernetes.io/basic-auth
stringData:
  username: shop
  password: shop
