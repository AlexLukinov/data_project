# Debezium PostgreSQL connector: streams row changes from shop-db to per-table Kafka topics
# (shop.public.customers / shop.public.orders / shop.public.order_items) via pgoutput.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: shop-postgres
  namespace: data-platform
  labels:
    strimzi.io/cluster: debezium
    app.kubernetes.io/part-of: data-platform-lab
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: shop-db-rw.data-platform.svc
    database.port: 5432
    database.user: shop
    database.password: shop
    database.dbname: shop
    topic.prefix: shop
    plugin.name: pgoutput
    slot.name: debezium_shop
    publication.name: dbz_publication
    publication.autocreate.mode: disabled
    table.include.list: public.customers,public.orders,public.order_items
    snapshot.mode: initial
    # per-table topic naming; keep messages as plain JSON envelopes
    topic.creation.enable: true
    topic.creation.default.replication.factor: 1
    topic.creation.default.partitions: 1
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
