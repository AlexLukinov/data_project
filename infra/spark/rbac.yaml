# RBAC for the Spark driver to create executor pods in data-platform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: data-platform
  labels:
    app.kubernetes.io/part-of: data-platform-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: data-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-rolebinding
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: data-platform
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
