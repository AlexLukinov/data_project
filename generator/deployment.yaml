# Event generator. Starts at replicas: 0 — `make stream-on` scales to 1, `make stream-off` to 0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-gen
  namespace: data-platform
  labels:
    app: event-gen
    app.kubernetes.io/part-of: data-platform-lab
spec:
  replicas: 0
  selector:
    matchLabels:
      app: event-gen
  template:
    metadata:
      labels:
        app: event-gen
    spec:
      containers:
        - name: event-gen
          image: event-gen:dev
          imagePullPolicy: Never        # built into minikube via `minikube image build`
          env:
            - name: KAFKA_BOOTSTRAP
              value: platform-kafka-bootstrap:9092
            - name: KAFKA_TOPIC
              value: clickstream
            - name: EVENTS_PER_SEC
              value: "5"
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
